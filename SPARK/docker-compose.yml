x-spark-image: &spark-image
  image: lab-spark:3.5.5-python3
  build: .

services:
  spark-master:
    <<: *spark-image
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - ELASTICSEARCH_URL=http://host.docker.internal:9200
      - ELASTICSEARCH_INDEX=spark-eventos
    ports:
      - "8080:8080"   # Interface web do Master
      - "7077:7077"   # Porta do cluster
    volumes:
      - ./apps:/opt/spark-apps
      - ./data:/opt/spark-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - spark-net

  spark-worker-1:
    <<: *spark-image
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_WEBUI_PORT=8081
    ports:
      - "8081:8081"   # Interface web do Worker 1
    volumes:
      - ./apps:/opt/spark-apps
      - ./data:/opt/spark-data
    depends_on:
      - spark-master
    networks:
      - spark-net

  spark-worker-2:
    <<: *spark-image
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_WEBUI_PORT=8081
    ports:
      - "8082:8081"   # Interface web do Worker 2
    volumes:
      - ./apps:/opt/spark-apps
      - ./data:/opt/spark-data
    depends_on:
      - spark-master
    networks:
      - spark-net

  spark-worker-3:
    <<: *spark-image
    container_name: spark-worker-3
    hostname: spark-worker-3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_WEBUI_PORT=8081
    ports:
      - "8083:8081"   # Interface web do Worker 3
    volumes:
      - ./apps:/opt/spark-apps
      - ./data:/opt/spark-data
    depends_on:
      - spark-master
    networks:
      - spark-net

  # Detector: liga junto com o cluster e reinicia sozinho se cair.
  detector:
    <<: *spark-image
    container_name: spark-detector
    hostname: spark-detector
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf spark.driver.host=spark-detector
      /opt/spark-apps/deny_list.py
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps:/opt/spark-apps
    depends_on:
      - spark-master
    networks:
      - spark-net

networks:
  spark-net:
    driver: bridge
